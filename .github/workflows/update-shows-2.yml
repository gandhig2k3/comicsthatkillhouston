name: Update Houston comedy shows
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_shows.py
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      - name: Save changes
        run: |
          git config user.name "show-updater"
          git config user.email "actions@users.noreply.github.com"
          git add shows.json
          git diff --staged --quiet || git commit -m "Update shows"
          git push
